# Fly.io configuration for the API.
#
# Region `fra` is not a preference, it is the whole point: the Neon project is
# in AWS eu-central-1 (Frankfurt), and a database round trip measured from a
# development machine costs ~238 ms. Co-locating the app with the database puts
# that into single digits, which outweighs every query optimisation in the
# codebase combined. Deploying this anywhere else undoes that.
#
# Regenerated by `fly launch`; the values below are the ones that were written
# by hand, so keep the comments if flyctl rewrites this file again.

app = 'naftal-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # Runs once per release, before the new machines take traffic, so a failed
  # migration aborts the release instead of leaving a half-migrated database
  # serving requests. Uses DIRECT_URL: migrations cannot run through PgBouncer.
  release_command = 'npx prisma migrate deploy'

# Non-secret configuration only. Everything sensitive goes through
# `fly secrets set` (see scripts/fly-secrets.mjs), which stores it encrypted
# rather than baking it into this committed file or the image.
# TRUST_PROXY is true because TLS terminates at Fly's proxy, so
# X-Forwarded-For is trustworthy here — and only here.
[env]
  ENABLE_DOCS = 'false'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '8080'
  TRUST_PROXY = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Zero keeps it inside the free allowance at the cost of a ~2 s cold start on
  # the first request. Set to 1 the day before a demo so the jury never waits.
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  # 512 MB rather than 256: argon2id is configured at OWASP's parameters, which
  # allocate ~19 MB per hash by design. Several concurrent logins on a 256 MB
  # machine risk the OOM killer.
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
